<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>K&amp;J Cut Guide</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body {
    margin: 0; min-height: 100dvh;
    padding: max(.6rem, env(safe-area-inset-top)) .7rem max(.6rem, env(safe-area-inset-bottom));
    background: #14161a; color: #e8eaed;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: .5rem;
    user-select: none;
  }
  .colhead {
    font-size: .62rem; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: #55585e; text-align: center;
  }

  #jobRow { width: 100%; display: flex; gap: .4rem; align-items: center; }
  select {
    flex: 1; font: inherit; font-size: .8rem; background: #1c1f24; color: #e8eaed;
    border: 1px solid #2c3037; border-radius: .45rem; padding: .5rem;
  }

  #queue {
    width: 100%; display: flex; flex-direction: column-reverse; gap: .22rem;
    align-items: center; max-height: 6rem; overflow-y: auto;
  }
  .qitem {
    width: 100%; display: flex; justify-content: space-between;
    font-variant-numeric: tabular-nums;
    background: #1c1f24; border: 1px solid #24272c; border-radius: .4rem;
    padding: .28rem .6rem; color: #8b9098; font-size: .9rem; font-weight: 600;
  }
  .qitem.next { color: #e8eaed; border-color: #3d424a; background: #23272d; }
  .qitem .id { font-size: .72rem; opacity: .7; }

  #stage { display: flex; align-items: center; justify-content: center; gap: .35rem; width: 100%; }
  .arrow { flex: 0 0 auto; width: 2.2rem; height: 2.2rem; color: #ffc400; visibility: hidden; }
  .arrow.show { visibility: visible; animation: nudge .9s ease-in-out infinite; }
  #arrowL.show { animation-name: nudgeL; }
  @keyframes nudge  { 0%,100% { transform: translateX(0); } 50% { transform: translateX(.3rem); } }
  @keyframes nudgeL { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-.3rem); } }

  #frame {
    flex: 1 1 auto; border-radius: .9rem; padding: .85rem;
    display: flex; flex-direction: column; gap: .55rem;
    background: #55585e; transition: background-color .12s linear;
  }
  #frame.onTarget { animation: flash .2s steps(1) infinite; }
  @keyframes flash {
    0%, 49%   { background-color: #17c964; }
    50%, 100% { background-color: #0a3d22; }
  }
  /* No !important inside keyframes - the spec ignores it, killing the rule. */
  #frame.reject { animation: rejectFlash .2s steps(1) 3; }
  @keyframes rejectFlash {
    0%, 49%   { background-color: #ff3b30; }
    50%, 100% { background-color: #2a0d0f; }
  }
  #frame.done { background: #24272c !important; animation: none; }

  .label {
    font-size: .64rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: #14161a; opacity: .75;
    margin-bottom: .2rem; padding-left: .15rem;
  }
  .box {
    background: #14161a; border-radius: .5rem; padding: .3rem .6rem;
    display: flex; align-items: baseline; justify-content: center; gap: .3rem;
    height: 4.3rem;
  }
  .num { font-variant-numeric: tabular-nums; font-size: 3rem; font-weight: 700;
         line-height: 1; letter-spacing: -.02em; }
  #targetNum { color: #e8eaed; }
  #currentNum { color: #ffc400; }
  .unit { font-size: 1rem; font-weight: 600; color: #8b9098; }

  #done { width: 100%; display: flex; flex-direction: column; gap: .22rem;
          max-height: 6rem; overflow-y: auto; }
  .ditem {
    display: flex; justify-content: space-between; align-items: baseline; gap: .5rem;
    background: #16241b; border: 1px solid #1f3d2a; border-radius: .4rem;
    padding: .28rem .6rem; font-variant-numeric: tabular-nums;
  }
  .ditem .v { color: #17c964; font-weight: 700; font-size: .9rem; }
  .ditem .loc { color: #e8eaed; font-weight: 700; font-size: .9rem;
                background: #1f3d2a; border-radius: .3rem; padding: 0 .4rem; }
  .ditem .t { color: #5c7566; font-size: .7rem; margin-left: auto; }
  .ditem.fresh { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: translateY(-1rem) scale(1.05); background: #1f5c38; }
                   100% { transform: none; } }

  #panel { width: 100%; display: flex; flex-direction: column; gap: .45rem; margin-top: auto; }
  .ctl { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: #8b9098; }
  input[type=range] { flex: 1; accent-color: #ffc400; height: 1.9rem; }
  output { min-width: 3.6rem; font-variant-numeric: tabular-nums; text-align: right; }
  button {
    font: inherit; font-size: .82rem; font-weight: 700; padding: .65rem .8rem;
    border: 0; border-radius: .5rem; background: #ffc400; color: #14161a;
    cursor: pointer; touch-action: manipulation; flex: 1;
  }
  button.ghost { background: #24272c; color: #b6bac0; }
  #status { font-size: .72rem; color: #6f747b; text-align: center; min-height: 1.1em; }
  #diffOut { font-size: .76rem; color: #6f747b; text-align: center; font-variant-numeric: tabular-nums; }
  .simRow.hidden { display: none; }

  #badges { display: flex; gap: .35rem; justify-content: center; flex-wrap: wrap; }
  .badge { font-size: .58rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
           padding: .16rem .45rem; border-radius: 1rem; background: #24272c; color: #6f747b; }
  .badge.on { background: #2f2410; color: #ffc400; }
  #verBadge { background: #1a2230; color: #6f8cb0; }

  #locOverlay {
    position: fixed; inset: 0; background: #0b0d10ee; z-index: 20;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: .8rem; padding: 1rem;
  }
  #locOverlay.show { display: flex; }
  #locTitle { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: #8b9098; }
  #locCut { font-size: .95rem; color: #ffc400; font-weight: 700; font-variant-numeric: tabular-nums; }
  #locValue {
    font-size: 4.5rem; font-weight: 700; font-variant-numeric: tabular-nums;
    color: #e8eaed; min-height: 5rem; line-height: 1.1; letter-spacing: .05em;
  }
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; width: min(20rem, 100%); }
  #pad button { font-size: 1.4rem; padding: .8rem 0; background: #23272d; color: #e8eaed; }
  #pad button.ok { background: #17c964; color: #08210f; }
  #pad button.alt { background: #2f2410; color: #ffc400; }
  #locNote { width: min(20rem, 100%); font: inherit; font-size: .9rem; padding: .6rem;
             background: #1c1f24; color: #e8eaed; border: 1px solid #2c3037;
             border-radius: .45rem; display: none; }
  #locNote.show { display: block; }

  #veil {
    position: fixed; inset: 0; background: #000; z-index: 15;
    opacity: 0; pointer-events: none; transition: opacity .6s linear;
  }
  #veil.pointer { pointer-events: auto; }
</style>
</head>
<body>

  <div id="jobRow">
    <select id="jobSel"><option>Loading lists...</option></select>
    <button id="reload" class="ghost" style="flex:0 0 auto">&#8635;</button>
  </div>

  <div class="colhead">Cut list &mdash; next at bottom</div>
  <div id="queue"></div>

  <div id="stage">
    <svg id="arrowL" class="arrow" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12H5M12 5l-7 7 7 7"/>
    </svg>
    <div id="frame">
      <div>
        <div class="label">Cut pipe at length:</div>
        <div class="box"><span class="num" id="targetNum">--</span><span class="unit">mm</span></div>
      </div>
      <div>
        <div class="label">You are at:</div>
        <div class="box"><span class="num" id="currentNum">0</span><span class="unit">mm</span></div>
      </div>
    </div>
    <svg id="arrowR" class="arrow" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12h15M12 5l7 7-7 7"/>
    </svg>
  </div>

  <div id="diffOut"></div>
  <div id="badges">
    <span class="badge" id="verBadge">v?</span>
    <span class="badge" id="wakeBadge">screen lock off</span>
    <span class="badge" id="linkBadge">no tape</span>
    <span class="badge" id="powerBadge">active</span>
  </div>

  <div class="colhead">Confirmed cuts</div>
  <div id="done"></div>

  <div id="panel">
    <div class="ctl simRow" id="simRow">
      <input type="range" id="sim" min="0" max="400" step="1" value="0">
      <output id="simOut">0 mm</output>
    </div>
    <div class="ctl">
      <button id="save">Save</button>
      <button id="export" class="ghost">CSV</button>
      <button id="connect" class="ghost">Connect</button>
    </div>
    <div id="status">Pick a job, then connect.</div>
  </div>

  <div id="locOverlay">
    <div id="locTitle">Stored at position</div>
    <div id="locCut"></div>
    <div id="locValue">--</div>
    <div id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="alt" data-k="note">&hellip;</button>
      <button data-k="0">0</button>
      <button data-k="del">&#9003;</button>
      <button class="ok" data-k="ok" style="grid-column: span 3">OK</button>
    </div>
    <textarea id="locNote" rows="2" placeholder="Comment instead of a position number"></textarea>
  </div>

  <div id="veil"></div>

<script>
// Bump this on every deploy so the running build is visible on screen.
const APP_VERSION = 'v3 2026-08-20';

// UUIDs from REEKON BLE Connection Guide and SDK, Rev 1.4
const POSITION_SERVICE = '7ad09b02-1f68-4c68-922f-a063dfdb7912';
const LIVE_MEASUREMENT = '0d689f63-fdf9-4f0f-8522-736d4723ad2f';
const SYNC_SERVICE     = '43744f76-de4d-4b05-a14a-0c133a785d8e';
const SYNC_COMM        = '6f0b2d1e-99e2-4ef4-bfab-70a5f3890f32';
const BATTERY_SERVICE  = 'battery_service';
const OPCODE_MEASUREMENT = 4;

const RED_AT = 100, GREEN_AT = 1, ON_TARGET_TOL = 0.5;
const DEADBAND_UM = 200;

// Power saving stages, seconds of inactivity
const DIM_AFTER = 45, DEEP_AFTER = 180, RELEASE_AFTER = 420;
const IDLE_HZ = 2, ACTIVE_HZ = 8;

const $ = id => document.getElementById(id);
const frameEl=$('frame'), arrowL=$('arrowL'), arrowR=$('arrowR');
const targetNum=$('targetNum'), currentNum=$('currentNum');
const queueEl=$('queue'), doneEl=$('done');
const sim=$('sim'), simOut=$('simOut'), simRow=$('simRow');
const btn=$('connect'), saveBtn=$('save'), exportBtn=$('export');
const statusEl=$('status'), diffOut=$('diffOut');
const wakeBadge=$('wakeBadge'), linkBadge=$('linkBadge'), powerBadge=$('powerBadge'), verBadge=$('verBadge');
const jobSel=$('jobSel'), reloadBtn=$('reload');
const locOverlay=$('locOverlay'), locValue=$('locValue'), locCut=$('locCut'), locNote=$('locNote');
const veil=$('veil');

verBadge.textContent = APP_VERSION;

let device=null, liveChar=null, commChar=null;
let pollTimer=null, running=false, rejecting=false;
let currentMm=0, queue=[], confirmed=[], jobName='', jobId='';
let lastActivity=Date.now(), lastUm=null, powerStage=0;
let pendingCut=null, locBuf='';

/* ================= cut lists from git ================= */
async function loadIndex() {
  try {
    const res = await fetch('./lists/index.json', { cache: 'no-cache' });
    const data = await res.json();
    jobSel.innerHTML = '';
    data.lists.forEach(l => {
      const o = document.createElement('option');
      o.value = l.file; o.textContent = l.name;
      jobSel.appendChild(o);
    });
    if (data.lists.length) loadJob(data.lists[0].file);
  } catch (e) {
    jobSel.innerHTML = '<option>No lists found</option>';
    statusEl.textContent = 'Could not load lists/index.json';
  }
}

async function loadJob(file) {
  try {
    const res = await fetch('./lists/' + file, { cache: 'no-cache' });
    const data = await res.json();
    jobName = data.name || file;
    jobId   = data.job || '';
    // last element is the active target, so reverse the file order
    queue = data.cuts.slice().reverse().map(c => ({ id: c.id, mm: c.mm, note: c.note || '' }));
    confirmed = [];
    renderLists(); render();
    statusEl.textContent = jobName + ' \u2014 ' + queue.length + ' cuts.';
  } catch (e) {
    statusEl.textContent = 'Could not load ' + file;
  }
}

jobSel.addEventListener('change', () => loadJob(jobSel.value));
reloadBtn.addEventListener('click', () => { loadIndex(); poke(); });

/* ================= rendering ================= */
function renderLists() {
  queueEl.innerHTML = '';
  queue.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'qitem' + (i === queue.length - 1 ? ' next' : '');
    d.innerHTML = '<span class="id">' + c.id + '</span><span>' + c.mm + ' mm</span>';
    queueEl.appendChild(d);
  });
  doneEl.innerHTML = '';
  confirmed.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'ditem' + (i === 0 ? ' fresh' : '');
    const loc = c.comment ? '&hellip;' : c.location;
    d.innerHTML = '<span class="v">' + c.mm + ' mm</span>'
                + '<span class="loc">' + loc + '</span>'
                + '<span class="t">' + c.time + '</span>';
    d.title = c.comment || '';
    doneEl.appendChild(d);
  });
}

function onTarget() {
  if (!queue.length) return false;
  return Math.abs(Math.round(currentMm) - queue[queue.length - 1].mm) <= ON_TARGET_TOL;
}

function render() {
  const target = queue.length ? queue[queue.length - 1].mm : null;
  const shownCurrent = Math.round(currentMm);
  currentNum.textContent = shownCurrent;
  simOut.textContent = Math.round(Number(sim.value)) + ' mm';

  if (target === null) {
    targetNum.textContent = '--';
    frameEl.classList.remove('onTarget');
    frameEl.classList.add('done');
    arrowL.classList.remove('show'); arrowR.classList.remove('show');
    diffOut.textContent = '';
    return;
  }
  frameEl.classList.remove('done');
  targetNum.textContent = target;

  const diff = shownCurrent - target, err = Math.abs(diff);
  if (err <= ON_TARGET_TOL) {
    frameEl.classList.add('onTarget');
    if (!rejecting) frameEl.style.backgroundColor = '';
    diffOut.textContent = 'On target';
    arrowL.classList.remove('show'); arrowR.classList.remove('show');
  } else {
    frameEl.classList.remove('onTarget');
    if (!rejecting) frameEl.style.backgroundColor = errorColor(err);
    diffOut.textContent = (diff > 0 ? '+' : '') + diff + ' mm';
    arrowL.classList.toggle('show', diff > 0);
    arrowR.classList.toggle('show', diff < 0);
  }
}

function errorColor(err) {
  const c = Math.min(Math.max(err, GREEN_AT), RED_AT);
  const t = (RED_AT - c) / (RED_AT - GREEN_AT);
  return 'hsl(' + (120 * Math.pow(t, 1.6)).toFixed(1) + ', 72%, 44%)';
}

/* ================= save / reject / storage prompt ================= */
function attemptSave() {
  if (!queue.length || pendingCut) return;
  if (!onTarget()) { rejectSave(); return; }
  pendingCut = queue[queue.length - 1];
  openLocPrompt();
}

function rejectSave() {
  rejecting = true;
  frameEl.classList.remove('reject');
  void frameEl.offsetWidth;
  frameEl.classList.add('reject');
  if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
  statusEl.textContent = 'Rejected \u2014 not on target.';
}
frameEl.addEventListener('animationend', e => {
  if (e.animationName === 'rejectFlash') {
    frameEl.classList.remove('reject'); rejecting = false; render();
  }
});

function openLocPrompt() {
  locBuf = '';
  locNote.value = '';
  locNote.classList.remove('show');
  locValue.textContent = '--';
  locCut.textContent = pendingCut.id + '  \u00b7  ' + pendingCut.mm + ' mm';
  locOverlay.classList.add('show');
  if (navigator.vibrate) navigator.vibrate(40);
}

$('pad').addEventListener('click', e => {
  const k = e.target.dataset.k;
  if (!k) return;
  poke();
  if (k === 'del') {
    locBuf = locBuf.slice(0, -1);
  } else if (k === 'note') {
    locNote.classList.toggle('show');
    if (locNote.classList.contains('show')) locNote.focus();
  } else if (k === 'ok') {
    commitCut();
    return;
  } else {
    if (locBuf.length < 2) locBuf += k;      // 0-99
  }
  locValue.textContent = locBuf === '' ? '--' : locBuf;
});

function commitCut() {
  const comment = locNote.classList.contains('show') ? locNote.value.trim() : '';
  if (locBuf === '' && !comment) {
    if (navigator.vibrate) navigator.vibrate([60, 60]);
    return;                                   // need a position or a comment
  }
  queue.pop();
  confirmed.unshift({
    id: pendingCut.id,
    mm: pendingCut.mm,
    location: locBuf === '' ? '' : String(Number(locBuf)),
    comment: comment,
    time: new Date().toTimeString().slice(0, 8),
    iso: new Date().toISOString()
  });
  pendingCut = null;
  locOverlay.classList.remove('show');
  if (navigator.vibrate) navigator.vibrate(40);
  renderLists(); render();
  if (!queue.length) statusEl.textContent = 'List complete \u2014 ' + confirmed.length + ' cuts. Export CSV.';
}

/* ================= CSV export ================= */
exportBtn.addEventListener('click', () => {
  if (!confirmed.length) { statusEl.textContent = 'Nothing to export yet.'; return; }
  const rows = [['job', 'id', 'length_mm', 'position', 'comment', 'timestamp']];
  confirmed.slice().reverse().forEach(c => {
    rows.push([jobId, c.id, c.mm, c.location, c.comment.replace(/"/g, '""'), c.iso]);
  });
  const csv = rows.map(r => r.map(v => '"' + v + '"').join(';')).join('\r\n');
  // UTF-8 BOM so Excel reads the Swedish characters correctly
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cuts-' + (jobId || 'job') + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ================= power management ================= */
let wakeLock = null;

async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) { wakeBadge.textContent = 'no wake lock api'; return; }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeBadge.textContent = 'screen stays on';
    wakeBadge.classList.add('on');
    wakeLock.addEventListener('release', () => {
      wakeBadge.textContent = 'screen lock off';
      wakeBadge.classList.remove('on');
    });
  } catch (e) {
    wakeBadge.textContent = 'wake lock refused';
  }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) acquireWakeLock();
});

function poke() {
  lastActivity = Date.now();
  if (powerStage !== 0) setPowerStage(0);
}
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, poke, true));

function setPowerStage(stage) {
  powerStage = stage;
  if (stage === 0) {
    veil.style.opacity = 0; veil.classList.remove('pointer');
    powerBadge.textContent = 'active'; powerBadge.classList.add('on');
    if (running && !wakeLock) acquireWakeLock();
  } else if (stage === 1) {
    veil.style.opacity = .6; veil.classList.remove('pointer');
    powerBadge.textContent = 'dimmed'; powerBadge.classList.remove('on');
  } else if (stage === 2) {
    veil.style.opacity = .94; veil.classList.add('pointer');
    powerBadge.textContent = 'deep dim'; powerBadge.classList.remove('on');
  } else {
    veil.style.opacity = .94; veil.classList.add('pointer');
    powerBadge.textContent = 'sleeping'; powerBadge.classList.remove('on');
    releaseWakeLock();
  }
}
veil.addEventListener('pointerdown', e => { e.stopPropagation(); poke(); }, true);

setInterval(() => {
  const idle = (Date.now() - lastActivity) / 1000;
  let want = 0;
  if (idle > RELEASE_AFTER) want = 3;
  else if (idle > DEEP_AFTER) want = 2;
  else if (idle > DIM_AFTER) want = 1;
  if (want !== powerStage) setPowerStage(want);
}, 2000);

/* ================= BLE ================= */
btn.addEventListener('click', async () => {
  poke();
  if (device && device.gatt.connected) { device.gatt.disconnect(); return; }
  if (!navigator.bluetooth) { statusEl.textContent = 'Web Bluetooth unavailable in this browser.'; return; }
  try {
    statusEl.textContent = 'Pick your tape...';
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [POSITION_SERVICE, SYNC_SERVICE, BATTERY_SERVICE]
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    const server = await device.gatt.connect();

    const pos = await server.getPrimaryService(POSITION_SERVICE);
    liveChar = await pos.getCharacteristic(LIVE_MEASUREMENT);

    try {
      const sync = await server.getPrimaryService(SYNC_SERVICE);
      commChar = await sync.getCharacteristic(SYNC_COMM);
      await commChar.startNotifications();
      commChar.addEventListener('characteristicvaluechanged', onSyncNotify);
    } catch (e) { commChar = null; }

    btn.textContent = 'Disconnect';
    simRow.classList.add('hidden');
    linkBadge.textContent = 'tape linked'; linkBadge.classList.add('on');
    statusEl.textContent = commChar ? 'Live. Press save on the tape.' : 'Live view only.';
    acquireWakeLock();
    running = true;
    tick();
  } catch (err) {
    statusEl.textContent = err.name === 'NotFoundError'
      ? 'No tape selected. Wake it by pulling the blade first.'
      : 'Error: ' + err.message;
  }
});

function onSyncNotify(ev) {
  const dv = ev.target.value;
  if (dv.byteLength < 8) return;
  if (dv.getUint32(0, true) === OPCODE_MEASUREMENT) { poke(); attemptSave(); }
}

async function tick() {
  if (!running || !liveChar) return;
  const t0 = performance.now();
  try {
    const v = await liveChar.readValue();
    const um = v.getInt32(0, true);           // SDK: 4 bytes, micrometres
    if (lastUm === null || Math.abs(um - lastUm) >= DEADBAND_UM) { lastUm = um; poke(); }
    currentMm = um / 1000;
    render();
  } catch (e) { /* transient */ }
  const hz = powerStage >= 2 ? IDLE_HZ : ACTIVE_HZ;
  pollTimer = setTimeout(tick, Math.max(0, (1000 / hz) - (performance.now() - t0)));
}

function onDisconnect() {
  running = false;
  clearTimeout(pollTimer);
  pollTimer = null; liveChar = null; commChar = null;
  btn.textContent = 'Connect';
  simRow.classList.remove('hidden');
  linkBadge.textContent = 'no tape'; linkBadge.classList.remove('on');
  statusEl.textContent = 'Tape disconnected.';
  releaseWakeLock();
}

sim.addEventListener('input', () => { poke(); if (!running) { currentMm = Number(sim.value); render(); } });
saveBtn.addEventListener('click', () => { poke(); attemptSave(); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

setPowerStage(0);
loadIndex();
</script>
</body>
</html>
